<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="150" r="180" fill="#00F2FE" opacity="0.12" filter="url(#glow)" />
  <circle cx="1000" cy="450" r="220" fill="#A855F7" opacity="0.12" filter="url(#glow)" />

  <!-- Grid overlay -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Content Box -->
  <rect x="80" y="80" width="1040" height="470" rx="24" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Brand Emblem -->
  <rect x="130" y="130" width="70" height="70" rx="16" fill="url(#neonGrad)" />
  <text x="165" y="174" fill="#07090E" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="28" text-anchor="middle">YR</text>

  <!-- Status Pill -->
  <rect x="220" y="145" width="410" height="40" rx="20" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" />
  <circle cx="242" cy="165" r="5" fill="#10B981" />
  <text x="260" y="170" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600">Available for SDE Internships • 2023–2027</text>

  <!-- Main Headline -->
  <text x="130" y="270" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="52" letter-spacing="-1">Yokeshwaran R</text>
  <text x="130" y="325" fill="url(#neonGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="34">Architecting Scalable Web & Systems</text>

  <!-- Subtitle -->
  <text x="130" y="380" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="20">
    B.Sc. Computer Science • Hindustan College • MCTM School Alumnus
  </text>
  <text x="130" y="415" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="16">
    Base: Alwarpet, Chennai, Tamil Nadu, India • Full-Stack, C++, Algorithms
  </text>

  <!-- Badges -->
  <rect x="130" y="460" width="160" height="38" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
  <text x="210" y="484" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle">15+ Projects</text>

  <rect x="305" y="460" width="190" height="38" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
  <text x="400" y="484" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle">Hindustan College</text>

  <rect x="510" y="460" width="170" height="38" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
  <text x="595" y="484" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle">Batch 2023–2027</text>
</svg>

